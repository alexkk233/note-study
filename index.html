<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Note Sprint Prototype</title>
<style>
  :root{
    --bg:#f7f7fb; --card:#fff; --text:#222; --muted:#7a7a86; --line:#dedee7;
    --good:#2e9d5b; --bad:#cf4b4b; --accent:#6f61d9;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .app{max-width:520px;margin:0 auto;padding:22px 18px 44px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .title{font-size:20px;font-weight:800}
  .sub{font-size:12px;color:var(--muted)}
  .stats{display:flex;gap:10px;font-size:13px;font-weight:700}
  .pill{background:#fff;border:1px solid #e5e5ec;padding:7px 10px;border-radius:999px}
  .progress{height:9px;background:#e7e7ef;border-radius:99px;overflow:hidden;margin:14px 0 18px}
  .progress > div{height:100%;width:0;background:var(--accent);transition:.25s}
  .card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(40,40,70,.08)}
  .question-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .clef-label{font-size:13px;color:var(--muted);font-weight:700}
  .timer{font-size:13px;color:var(--muted)}
  #staffWrap{height:260px;display:flex;align-items:center;justify-content:center}
  svg{width:100%;max-width:430px;height:240px}
  .answers{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
  button.answer{
    border:2px solid #e4e4ec;background:#fff;border-radius:16px;padding:15px 14px;
    font-size:18px;font-weight:800;cursor:pointer;transition:.12s;
  }
  button.answer:active{transform:scale(.985)}
  button.answer.good{border-color:var(--good);background:#eefaf2;color:#207a43}
  button.answer.bad{border-color:var(--bad);background:#fff0f0;color:#a42f2f}
  .feedback{min-height:42px;margin-top:14px;text-align:center;font-weight:800}
  .feedback small{display:block;margin-top:4px;color:var(--muted);font-weight:600}
  .controls{display:flex;gap:10px;margin-top:16px}
  .control{
    flex:1;background:#fff;border:1px solid #e0e0e8;border-radius:14px;padding:10px;
    font-size:13px;font-weight:700;cursor:pointer;
  }
  .finish{display:none;text-align:center;padding:24px 4px}
  .finish h2{font-size:28px;margin:4px 0}
  .finish .big{font-size:48px;font-weight:900;margin:12px 0}
  .finish p{color:var(--muted);line-height:1.55}
  .restart{border:0;background:var(--accent);color:#fff;border-radius:15px;padding:14px 20px;font-weight:800;font-size:16px;cursor:pointer}
  .legend{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="title">♪ Note Sprint</div><div class="sub">악보를 보고 음 이름 맞히기</div></div>
    <div class="stats">
      <span class="pill" id="score">✓ 0</span>
      <span class="pill" id="streak">🔥 0</span>
    </div>
  </div>

  <div class="progress"><div id="progressBar"></div></div>

  <div class="card" id="quizCard">
    <div class="question-head">
      <div class="clef-label" id="clefLabel">높은음자리표</div>
      <div class="timer" id="timer">0.0s</div>
    </div>

    <div id="staffWrap">
      <svg viewBox="0 0 430 240" aria-label="music staff">
        <g id="staff"></g>
        <text id="clefGlyph" x="36" y="143" font-size="92" font-family="serif">𝄞</text>
        <g id="noteGroup"></g>
      </svg>
    </div>

    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="finish" id="finish">
    <div class="sub">10문제 완료</div>
    <h2>세션 결과</h2>
    <div class="big" id="finalScore">0/10</div>
    <p id="finalDetail"></p>
    <button class="restart" onclick="startSession()">한 번 더</button>
  </div>

  <div class="controls">
    <button class="control" id="modeBtn" onclick="toggleMode()">모드: 높은+낮은</button>
    <button class="control" id="soundBtn" onclick="toggleSound()">소리: ON</button>
  </div>
  <div class="legend">
    프로토타입 규칙: 10문제 · 3지선다 · 인접 음 중심 오답 · 틀린 음은 이후 문제에서 다시 나올 확률 증가.<br>
    표기는 <b>C4</b> 형식(가운데 도 = C4).
  </div>
</div>

<script>
const NOTES = ["C","D","E","F","G","A","B"];
const TREBLE = [
  ["C",4,-2],["D",4,-1],["E",4,0],["F",4,1],["G",4,2],["A",4,3],["B",4,4],
  ["C",5,5],["D",5,6],["E",5,7],["F",5,8],["G",5,9],["A",5,10]
];
const BASS = [
  ["E",2,-2],["F",2,-1],["G",2,0],["A",2,1],["B",2,2],["C",3,3],["D",3,4],
  ["E",3,5],["F",3,6],["G",3,7],["A",3,8],["B",3,9],["C",4,10]
];

let mode = "mixed", soundOn = true;
let q = 0, correct = 0, streak = 0, startTime = 0;
let times = [], weak = {}, current = null, locked = false;

function drawStaff(){
  const g = document.getElementById("staff");
  g.innerHTML = "";
  for(let i=0;i<5;i++){
    const y=84+i*18;
    g.innerHTML += `<line x1="98" y1="${y}" x2="390" y2="${y}" stroke="#222" stroke-width="1.6"/>`;
  }
}

function posY(step){ return 156 - step*9; }

function noteKey(n){ return `${n[0]}${n[1]}`; }

function pickQuestion(){
  let clef;
  if(mode==="treble") clef="treble";
  else if(mode==="bass") clef="bass";
  else clef=Math.random()<0.5?"treble":"bass";

  const pool = clef==="treble"?TREBLE:BASS;

  // 35% 확률로 이전에 틀린 음을 재출제
  const weakCandidates = pool.filter(n => (weak[noteKey(n)]||0)>0);
  let n;
  if(weakCandidates.length && Math.random()<0.35){
    const weighted=[];
    weakCandidates.forEach(x=>{
      for(let i=0;i<Math.min(4, weak[noteKey(x)]);i++) weighted.push(x);
    });
    n = weighted[Math.floor(Math.random()*weighted.length)];
  } else {
    n = pool[Math.floor(Math.random()*pool.length)];
  }
  return {clef, n, pool};
}

function makeAnswers(question){
  const {n,pool} = question;
  const idx = pool.findIndex(x=>x[0]===n[0] && x[1]===n[1]);
  const picks=[n];

  // 인접 스태프 음을 우선 오답으로 사용
  const offsets = Math.random()<0.5 ? [-1,1] : [-2,1];
  offsets.forEach(o=>{
    if(pool[idx+o]) picks.push(pool[idx+o]);
  });
  while(picks.length<3){
    const c=pool[Math.floor(Math.random()*pool.length)];
    if(!picks.some(x=>noteKey(x)===noteKey(c))) picks.push(c);
  }
  return picks.sort(()=>Math.random()-.5);
}

function drawNote(qn){
  const {clef,n} = qn;
  const glyph=document.getElementById("clefGlyph");
  glyph.textContent = clef==="treble" ? "𝄞" : "𝄢";
  glyph.setAttribute("y", clef==="treble" ? "145" : "137");
  glyph.setAttribute("font-size", clef==="treble" ? "92" : "78");
  document.getElementById("clefLabel").textContent = clef==="treble" ? "높은음자리표" : "낮은음자리표";

  const ng=document.getElementById("noteGroup");
  const y=posY(n[2]), x=265;
  let ledger="";
  // staff spans steps 0..8. Draw ledger lines outside.
  if(n[2] < 0){
    for(let s=-2;s>=n[2];s-=2){
      ledger += `<line x1="${x-17}" y1="${posY(s)}" x2="${x+17}" y2="${posY(s)}" stroke="#222" stroke-width="1.7"/>`;
    }
  }
  if(n[2] > 8){
    for(let s=10;s<=n[2];s+=2){
      ledger += `<line x1="${x-17}" y1="${posY(s)}" x2="${x+17}" y2="${posY(s)}" stroke="#222" stroke-width="1.7"/>`;
    }
  }
  ng.innerHTML = ledger +
    `<ellipse cx="${x}" cy="${y}" rx="10.5" ry="7.5" transform="rotate(-18 ${x} ${y})" fill="#222"/>`+
    `<line x1="${x+9}" y1="${y-2}" x2="${x+9}" y2="${y-49}" stroke="#222" stroke-width="3"/>`;
}

function showQuestion(){
  if(q>=10){ finishSession(); return; }
  locked=false;
  document.getElementById("feedback").innerHTML="";
  current=pickQuestion();
  drawNote(current);
  const opts=makeAnswers(current);
  const a=document.getElementById("answers");
  a.innerHTML="";
  opts.forEach(n=>{
    const b=document.createElement("button");
    b.className="answer";
    b.textContent=noteKey(n);
    b.onclick=()=>answer(b,n);
    a.appendChild(b);
  });
  startTime=performance.now();
}

function answer(btn,n){
  if(locked)return;
  locked=true;
  const elapsed=(performance.now()-startTime)/1000;
  times.push(elapsed);

  const ok = noteKey(n)===noteKey(current.n);
  const buttons=[...document.querySelectorAll(".answer")];
  buttons.forEach(b=>{
    if(b.textContent===noteKey(current.n)) b.classList.add("good");
  });

  if(ok){
    correct++; streak++;
    if(weak[noteKey(current.n)]) weak[noteKey(current.n)]--;
    document.getElementById("feedback").innerHTML=`정답! <small>${elapsed.toFixed(1)}초</small>`;
    playTone(current.n);
  }else{
    btn.classList.add("bad");
    streak=0;
    weak[noteKey(current.n)] = (weak[noteKey(current.n)]||0)+2;
    document.getElementById("feedback").innerHTML=`정답은 ${noteKey(current.n)} <small>이 음은 뒤에서 다시 나올 확률이 올라갑니다.</small>`;
  }
  q++;
  updateStats();
  setTimeout(showQuestion, 850);
}

function updateStats(){
  document.getElementById("score").textContent=`✓ ${correct}`;
  document.getElementById("streak").textContent=`🔥 ${streak}`;
  document.getElementById("progressBar").style.width=`${q*10}%`;
}

function finishSession(){
  document.getElementById("quizCard").style.display="none";
  document.getElementById("finish").style.display="block";
  document.getElementById("finalScore").textContent=`${correct}/10`;
  const avg = times.length ? times.reduce((a,b)=>a+b,0)/times.length : 0;
  const weakList=Object.entries(weak).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  document.getElementById("finalDetail").innerHTML =
    `정확도 <b>${correct*10}%</b> · 평균 반응 <b>${avg.toFixed(1)}초</b>` +
    (weakList.length ? `<br>복습 추천: <b>${weakList.join(", ")}</b>` : `<br>이번 세트는 약점 음표가 거의 없었어요.`);
}

function startSession(){
  q=0;correct=0;streak=0;times=[];weak={};
  document.getElementById("quizCard").style.display="block";
  document.getElementById("finish").style.display="none";
  updateStats(); showQuestion();
}

function toggleMode(){
  mode = mode==="mixed" ? "treble" : mode==="treble" ? "bass" : "mixed";
  document.getElementById("modeBtn").textContent =
    "모드: " + (mode==="mixed"?"높은+낮은":mode==="treble"?"높은음":"낮은음");
  startSession();
}

function toggleSound(){
  soundOn=!soundOn;
  document.getElementById("soundBtn").textContent="소리: "+(soundOn?"ON":"OFF");
}

function midiNumber(name,oct){
  const semis={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  return 12*(oct+1)+semis[name];
}
function playTone(n){
  if(!soundOn)return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    const midi=midiNumber(n[0],n[1]);
    o.frequency.value=440*Math.pow(2,(midi-69)/12);
    o.type="sine"; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.12,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.38);
    o.start();o.stop(ctx.currentTime+.4);
  }catch(e){}
}

function tick(){
  if(!locked && startTime){
    const t=(performance.now()-startTime)/1000;
    document.getElementById("timer").textContent=t.toFixed(1)+"s";
  }
  requestAnimationFrame(tick);
}
drawStaff();startSession();tick();
</script>
</body>
</html>
